<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉诺塔游戏</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="home-screen" class="screen active">
        <div class="home-content">
            <h1>汉诺塔游戏</h1>
            <div class="settings-panel">
                <div class="setting-item">
                    <label for="disk-count">圆盘数量：</label>
                    <input type="number" id="disk-count" min="3" max="8" value="4">
                </div>
                <div class="mode-selection">
                    <button id="play-mode-btn" class="mode-btn selected">
                        <span class="mode-text">游玩</span>
                    </button>
                    <button id="demo-mode-btn" class="mode-btn">
                        <span class="mode-text">自动演示</span>
                    </button>
                </div>
                <button id="start-btn" class="start-btn">开始游戏</button>
            </div>
        </div>
    </div>
    
    <div id="game-screen" class="screen">
        <div class="game-header">
            <button id="back-home-btn" class="icon-btn"> 返回</button>
            <div class="game-stats">
                <span id="timer">⏱时间:00:00</span>
                <span id="move-count">移动步数: 0</span>
            </div>
            <button id="pause-btn" class="icon-btn"> 暂停</button>
        </div>
        
        <div id="game-area">
            <div class="tower" id="tower-0" data-tower="0">
                <div class="tower-pole"></div>
                <div class="tower-base"></div>
                <div class="disks-container"></div>
            </div>
            <div class="tower" id="tower-1" data-tower="1">
                <div class="tower-pole"></div>
                <div class="tower-base"></div>
                <div class="disks-container"></div>
            </div>
            <div class="tower" id="tower-2" data-tower="2">
                <div class="tower-pole"></div>
                <div class="tower-base"></div>
                <div class="disks-container"></div>
            </div>
        </div>
        
        <div id="drop-indicator" class="hidden">
            <div class="indicator-icon"></div>
        </div>
    </div>
    
    <div id="pause-screen" class="screen overlay">
        <div class="pause-content">
            <h2>游戏暂停</h2>
            <div class="pause-buttons">
                <button id="resume-btn" class="pause-action-btn">继续游戏</button>
                <button id="quit-btn" class="pause-action-btn quit">返回首页</button>
            </div>
        </div>
    </div>
    
    <!-- 结算界面 -->
    <div id="result-screen" class="screen overlay">
        <div class="result-content">
            <h2>恭喜通关！</h2>
            <div class="result-stats">
                <div class="stat-item">
                    <span class="stat-label">用时</span>
                    <span id="final-time" class="stat-value">00:00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">移动次数</span>
                    <span id="final-moves" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">圆盘数量</span>
                    <span id="final-disks" class="stat-value">4</span>
                </div>
            </div>
            <div class="result-buttons">
                <button id="play-again-btn" class="result-action-btn">再玩一次</button>
                <button id="home-btn" class="result-action-btn secondary">返回首页</button>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
